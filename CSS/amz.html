<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon nav Bar</title>
  <link rel="stylesheet" href="amz.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>
    <nav class="navbar">

        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"
            alt="Amazon_logo"
            width="100px">
        </div>

        <div class="search">
            <input type="search" placeholder="Search Amazon">
            <button><i class="fa-brands fa-sistrix"></i></button>
        </div>

        <div class="Login">
            Hello,sign in <br>
            <b>Account</b>
        </div>

        <div class="order">
            Returns<br>
            <b>& Orders</b>
        </div>

        <div class="cart">
            <button><i class="fa-solid fa-cart-shopping"></i><b>CART</b></button>
        </div>

    </nav>
</body>
</html>
