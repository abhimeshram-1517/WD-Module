<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid of Columns</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 bg-success">Division A</div>

            <div class="col-6 bg-primary">Division B</div>
            <div class="col-6 bg-danger">Division C</div>

            <div class="col-4 bg-success">Division D</div>
            <div class="col-4 bg-primary">Division E</div>
            <div class="col-4 bg-info">Division F</div>

             <div class="col-3 bg-success">Division G</div>
            <div class="col-3 bg-primary">Division H</div>
            <div class="col-3 bg-info">Division I</div>
            <div class="col-3 bg-success">Division J</div>
            

        </div>
    </div>
</body>
</html>
