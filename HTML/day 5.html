<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--LIST-->
    <!--Collection of Items-->

    <!--Ordered List / Number List-->
    <ol type="al" star="3">
        <li>Web</li>
        <li>SQL</li>
        <li>Java</li>
        <li>Python</li>
    </ol>

    <!--Unordered List / Bulleted List-->
    <ul type="disc">
        <li>Web</li>
        <li>SQL</li>
        <li>Java</li>
        <li>Python</li>
    </ul>

    <!--Discriptiona List / Definition List-->
    <dl>
        <dt>Virat Kohli</dt>
        <dd>Virat Kohli is an Indian international cricketer and former all-format captain of the Indian national cricket team. He is a right-handed batter and an occasional right-arm medium-pace bowler.</dd>
    </dl>

</body>
</body>
</html>
