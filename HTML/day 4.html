<!-- Registation Form -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
 </head>
 <body>
    <form action="">
        <fieldset><legend>Reg Form</legend>
        <label for="">Name:</label>
        <input type="text">
        <br><br>
        <label for="">Email:</label>
        <input type="email">
        <br><br>
        <label for="">Passwoed:</label>
        <input type="password">
        <br><br>
        <button>Submit</button>
        </fieldset>
    </form>

<!-- Application Form-->  

 <form action="#">
        <fieldset><legend>App. Form</legend>
        <label for="">Name:</label>
        <input type="text" id="name">
        <br><br>
        <label for="">Email:</label>
        <input type="email" id="email">
        <br><br>
        <label for="">Passwoed:</label>
        <input type="password" id="pass">
        <br><br>
        <label for="">Age:</label>
        <input type="number">
        <br><br>
        <label for="">DOB:</label>
        <input type="date">
        <br><br>
        <label for="">Gender:</label>
        <input type="radio" name="gender" value="Female">Female
        <input type="radio" name="gender" value="Male">Male
        <br><br>
        <label for="">Course:</label>
        <input type="checkbox">Web
        <input type="checkbox">SQL
        <input type="checkbox">Java
        <input type="checkbox">Python
        <br><br>
        <label for="">Branch:</label>
        <select>
           <option value="">Select</option>
           <option value="">Pune</option>
           <option value="">Mumbai</option>
           <option value="">Satara</option>
           <option value="">Solapur</option>
           <option value="">Bangloret</option>
        </select>
        <br><br>
        <label for="">Contact:</label>
        <input type="tel">
        <br><br>
        <label for="">Address:</label>
        <textarea></textarea>

        <br><br>
        <label for="">Photo:</label>
        <input type="file">
        <br><br>
        <input type="range">
        <button>Submit</button>
        </fieldset>
    </form>
 </body>
 </html>
